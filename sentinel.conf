# Minimal reflexdb-sentinel config template.
# Run with: reflexdb-sentinel sentinel.conf

port 26379

# One "sentinel monitor" block per primary/replica group you want Sentinel
# to watch and automatically fail over.
sentinel monitor mymaster 127.0.0.1 7379 1
sentinel down-after-milliseconds mymaster 5000

# Replicas of `mymaster` that Sentinel can promote/re-point during
# failover. reflexdb doesn't auto-discover these yet (see
# crates/server/src/bin/reflexdb-sentinel/config.rs) — list them explicitly.
# sentinel known-replica mymaster 127.0.0.1 7380

# Other reflexdb-sentinel processes watching the same master, consulted for
# quorum before failover (SENTINEL IS-MASTER-DOWN-BY-ADDR). Only needed if
# quorum > 1.
# sentinel known-sentinel mymaster 127.0.0.1 26380
