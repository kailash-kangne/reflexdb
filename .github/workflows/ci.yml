name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Checks all four categories (advisories/bans/licenses/sources)
      # against deny.toml at the repo root.
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Builds the fuzz scaffold (fuzz/) against libFuzzer — a compile-only
  # smoke test, not an actual fuzzing run, so a new fuzz target that
  # doesn't even build gets caught in CI instead of only at `cargo fuzz
  # run` time. Needs nightly: cargo-fuzz's sanitizer instrumentation isn't
  # available on stable.
  fuzz-build:
    name: fuzz (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build --fuzz-dir fuzz
