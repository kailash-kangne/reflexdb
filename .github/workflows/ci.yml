name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Checks all four categories (advisories/bans/licenses/sources)
      # against deny.toml at the repo root.
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Builds the fuzz scaffold and actually fuzzes each target for 90s —
  # short enough for PRs, long enough to smoke out crashes in the RESP
  # codec and RESTORE deserializer. Needs nightly: cargo-fuzz's sanitizer
  # instrumentation isn't available on stable.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - run: cargo install cargo-fuzz --locked
      - run: |
          for target in resp_decode restore_deserialize; do
            cargo fuzz run "$target" --fuzz-dir fuzz -- -max_total_time=90 -print_final_stats=1
          done

  # Crash-recovery + soak coverage the unit matrix doesn't emphasize:
  # SIGKILL during writes/rewrites, restart+replay, then a 60s mixed-load
  # soak ending in SIGKILL — every acked write must survive.
  durability:
    name: durability (crash + soak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p reflexdb-server --test crash_recovery --test partial_resync
        env:
          REFLEXDB_SOAK_SECS: "60"

  # Short server bench per OS — CI runners are shared VMs, so absolute
  # numbers are noisy; use them to compare platforms, not to quote.
  bench:
    name: bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p reflexdb-server
      - name: Start server
        shell: bash
        run: |
          DIR=$(mktemp -d)
          ./target/release/reflexdb-server --port 7777 --dir "$DIR" &
          for i in $(seq 1 100); do
            python3 -c "import socket; s=socket.create_connection(('127.0.0.1',7777),1); s.sendall(b'*1\r\n\$4\r\nPING\r\n'); assert b'PONG' in s.recv(64); s.close()" 2>/dev/null && exit 0
            sleep 0.2
          done
          echo "server did not start"; exit 1
      - name: Bench
        shell: bash
        run: python3 benchmarks/run.py --port 7777 --runs 2 --seconds 3 --live-subscribers 200 --output bench-results.jsonl
      - name: Feature smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y redis-tools
          else
            brew install redis
          fi
          HOST=127.0.0.1 PORT=7777 ./benchmarks/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: reflexdb-bench-${{ matrix.os }}
          path: bench-results.jsonl
