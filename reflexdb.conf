# Minimal reflexdb.conf template.
# Directives use familiar names where possible; unsupported
# directives are logged as warnings and ignored rather than rejected.

bind 127.0.0.1
port 7379
databases 16

# requirepass changeme
# maxmemory 100mb
# maxmemory-policy noeviction   # noeviction | allkeys-random | volatile-random |
                                 # allkeys-lru | volatile-lru | allkeys-lfu | volatile-lfu | volatile-ttl

# maxclients 10000              # hard cap on simultaneous connections (default: 10000)
                                 #   higher - more concurrent clients supported
                                 #          - con: each connection costs a task + buffers, so worst-case
                                 #            memory/fd usage rises with it
                                 #   lower  - bounds worst-case memory/fd usage
                                 #          - con: legitimate traffic gets queued/rejected sooner under
                                 #            a connection spike

# proto-max-bulk-len 64mb       # largest single value (RESP bulk string, APPEND/SETRANGE/SET/BITFIELD
                                 # target) accepted (default: 64mb, same as real Redis)
                                 #   higher - large-value workloads (big blobs as strings) stop being
                                 #            rejected
                                 #          - con: raises the worst-case memory one client command can
                                 #            force the server to allocate before any app-level check runs
                                 #   lower  - caps per-command memory risk tighter for untrusted clients
                                 #          - con: legitimate larger values get rejected

# dir ./data
# dbfilename dump.rdb

# profile cache|durable|replicated — preset bundle for the durability posture:
#   cache       - appendonly no                          -> total loss on restart
#   durable     - appendonly yes + appendfsync always     -> zero loss on kill -9
#   replicated  - appendonly yes + appendfsync everysec   -> writes refused (NOREPLICAS)
#               + min-replicas-to-write 1                   unless >=1 healthy replica
# Directives listed AFTER `profile` override its individual values.
# profile durable

# appendonly yes
# appendfilename appendonly.aof
# appendfsync no                # always | everysec | no   (default: no)
                                 #   always    - fsync every write      - max data loss: lowest  - throughput: slowest
                                 #   everysec  - fsync ~once a second   - max data loss: ~1s      - throughput: good
                                 #   no        - OS decides when to flush - max data loss: higher - throughput: fastest

# tiered-storage yes            # evicted keys spill to disk (fjall) instead of being dropped
# tiered-memory-limit 250mb
# tiered-dir tiered             # relative to `dir` unless absolute
# tiered-disk-limit 1gb         # disk-tier capacity; what "full" does is set by
                                 # tiered-overflow-policy — unset (default) means unbounded
# tiered-overflow-policy reject-writes  # reject-writes (default) | evict-oldest | no-limit
                                 #   reject-writes - once RAM is over tiered-memory-limit and the
                                 #     disk tier is full, refuse new keys (ERR TIERED_STORAGE_FULL);
                                 #     deletes/updates of existing keys still work — no data lost
                                 #   evict-oldest  - drop oldest tiered entries down to ~50% of the
                                 #     limit (real data loss — cache semantics)
                                 #   no-limit      - ignore tiered-disk-limit entirely

# eviction-tick-ms 100          # how often the background task re-checks maxmemory/tiered-*-limit
                                 # and runs TTL active-expire; lowering it reacts to write bursts
                                 # faster (background task, not the request path — doesn't cost
                                 # request latency)

# eviction-low-watermark 0.5    # once an eviction pass starts, how far below the triggering limit
                                 # it drains to, as a fraction of that limit (default: 0.5; range: (0, 1])
                                 #   lower (e.g. 0.3) - more headroom after a pass, write bursts take
                                 #                      longer to re-trigger eviction
                                 #                    - con: each pass moves/drops more keys
                                 #   1.0              - cheapest pass (drains exactly to the limit)
                                 #                    - con: next write can immediately re-trigger it

# eviction-max-per-tick 10000   # hard cap on keys one eviction pass moves/drops (default: 10000)
                                 #   higher - a huge overshoot drains in fewer ticks
                                 #          - con: one pass can monopolize a tick's CPU, delaying that
                                 #            tick's TTL active-expire/scheduled-command work
                                 #   lower  - bounds worst-case per-tick latency
                                 #          - con: a large overshoot takes many ticks to fully drain

# singleflight-max-wait-ms 10000  # cap on how long GET ... SINGLEFLIGHT blocks

# replicaof 127.0.0.1 7379      # start up already replicating from a primary
# min-replicas-to-write 1       # refuse writes (NOREPLICAS) while fewer than N connected
                                 # replicas are healthy (default: 0 = off; set by `profile replicated`)

# tls-port 7380                 # 0 disables; runs alongside the plain-text `port`.
                                 # Set `port 0` for TLS-only operation.
# tls-cert-file /etc/reflexdb/tls/cert.pem
# tls-key-file /etc/reflexdb/tls/key.pem

# notify-keyspace-events ""     # e.g. "KEA" for all keyspace/keyevent notifications; empty = off

# history-enabled yes           # turns on GETAT/HISTORY (time-travel) for string keys — proof of
                                 # concept, off by default to avoid the extra disk I/O
# history-dir history           # relative to `dir` unless absolute
# history-retention-ms 86400000 # age retention in milliseconds (default 24h); 0 disables age expiry
# history-max-versions-per-key 200 # maximum history entries per key (range 1..1000000)

# slowlog-log-slower-than 10000 # microseconds a command must take to be logged (SLOWLOG);
                                 # -1 disables, 0 logs everything
# slowlog-max-len 128           # oldest SLOWLOG entries drop once the log exceeds this

# live-sweep-ms 10              # idle gap between LIVE fan-out sweeps — writes landing in the gap
                                 # dedup into one re-evaluation (default: 10)
                                 #   higher - less fan-out CPU under a sustained write storm
                                 #          - con: subscribers see staler intermediate values
                                 #   0      - every dirty batch is pushed immediately
# live-pace-chunk 64            # subscriber socket writes per sweep before the fan-out thread
                                 # yields `live-pace-ms` (default: 64; 0 disables pacing)
                                 #   lower  - smoother CPU, writers never queue behind a push burst
                                 #          - con: a large subscriber set takes longer to fully drain
# live-pace-ms 1                # yield length per `live-pace-chunk` writes (default: 1)

# repl-backlog-size 32768       # per-replica outbound queue depth, in pending values (default: 32768)
                                 #   higher - absorbs a longer write burst before a replica is flagged slow
                                 #          - con: a slow replica can hold that many unflushed values
                                 #            in memory on the primary
                                 #   lower  - bounds primary memory held per lagging replica
                                 #          - con: a replica gets flagged slow/disconnected sooner

# repl-backlog-max-bytes 64mb   # total queued bytes before a replica is treated as slow (default: 64mb;
                                 # real Redis's comparable client-output-buffer-limit replica default is
                                 # 1gb — intentionally looser; this default favors primary memory safety)
                                 #   higher - tolerates a slower/further-away replica
                                 #          - con: more memory held per lagging replica
                                 #   lower  - safer for the primary under many/slow replicas
                                 #          - con: cuts off replicas sooner on a network blip

# repl-slow-disconnect-delay-ms 5000  # how long a replica stays flagged slow before being dropped
                                 # (forcing a full resync on reconnect) (default: 5000)
                                 #   higher - survives a brief network blip without losing the link
                                 #          - con: a replica that's behind counts as connected longer
                                 #   lower  - cuts a bad link loose faster
                                 #          - con: more resyncs from transient blips
