[workspace]
resolver = "2"
members = [
    "crates/resp",
    "crates/keyspace",
    "crates/commands",
    "crates/persistence",
    "crates/server",
    "crates/tiered",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
# This is an application, not a set of libraries meant for crates.io.
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
bytes = { version = "1", features = ["serde"] }
dashmap = "6"
papaya = "0.2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
rand = "0.8"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
